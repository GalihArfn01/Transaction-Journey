name: transaction_journey
description: "Aplikasi pencatatan keuangan pribadi - local-first, offline."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Database (SQLite, type-safe)
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Formatting & localization
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # Charts
  fl_chart: ^0.69.2

  # Export Excel
  excel: ^4.0.6
  share_plus: ^10.0.3

  # Backup / restore (file picking)
  file_picker: ^8.1.3

  # Security (Phase 14)
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Notifikasi lokal (pengingat Skor Kesehatan Finansial) — murni lokal,
  # tanpa backend/push server, sejalan dengan aplikasi ini yang
  # local-first/offline.
  flutter_local_notifications: ^18.0.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  async: ^2.11.0
  sqlite3: ^2.9.4

  flutter_lints: ^5.0.0

  # Hanya untuk test service notifikasi (registrasi singleton
  # platform-interface plugin di environment test tanpa plugin registrant).
  flutter_local_notifications_platform_interface: ^8.0.0

  # Code generation (Drift)
  build_runner: ^2.4.13
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

  # ─── FONT INTER (aktif, dibundel — lisensi SIL OFL) ────────────────────
  #
  # Seluruh aplikasi memakai 'Inter' sebagai fontFamily utama (lihat
  # `kAppFontFamily` di `lib/app/app_theme.dart`). Berkasnya ikut di repo
  # (`assets/fonts/`, subset latin dari Fontsource, lisensi OFL bebas
  # redistribusi), jadi tipografi seragam di semua perangkat tanpa unduhan
  # runtime. Detail lisensi & cara mengganti font: `assets/fonts/README.md`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
